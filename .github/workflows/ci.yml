name: CI

on:
  # main only, matching every sibling repo's lanes retrofit: a same-repo PR
  # branch also fires push, and that run always classifies as code (see the
  # lanes job below) rather than applying the pull_request run's docs-only
  # gating — so its unconditionally green `lanes` result could report over
  # a legitimately red PR-run verdict on the exact same commit. Restricting
  # to main removes the collision; main never carries an open PR against
  # itself.
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the lane on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  # Nothing in this repo dispatches this workflow today; the input exists
  # so `gh workflow run ci.yml -f pr=...` can, naming the PR it reports for.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number this run reports for.
        required: true
        type: string

# The `codex` status has exactly one writer, the codex-review sweep. Declaring
# read-only here is what proves this workflow is not a second one.
permissions:
  contents: read
  # The docs lane's classify and lanes steps read the PR's files and commits
  # through the workflow token; read-only, and still nothing here can write.
  pull-requests: read

jobs:
  # Decides whether the build job may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes are always classified
  # as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev libncurses-dev

      - name: Build
        run: make build

      - name: Test
        run: make test

  # The one check the ruleset should require. Always runs, always reports —
  # green only when the build job succeeded (across every matrix entry —
  # `fail-fast: false` means one failing os fails the aggregate result
  # without canceling the others), or when it was skipped and the skip is
  # INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded before
          # the heavy job ran; a pull_request run takes the same commit from
          # its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            build=${{ needs.build.result }}
