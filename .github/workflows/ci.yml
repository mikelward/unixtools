name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The `codex` status has exactly one writer, the codex-review sweep. Declaring
# read-only here is what proves this workflow is not a second one.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev libncurses-dev

      - name: Build
        run: make build

      - name: Test
        run: make test
