name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Declared rather than inherited. Without a block here the job takes the
# repository's default GITHUB_TOKEN permission -- a setting no file in the repo
# can see, and one that may be read/write, which would let this job write the
# `codex` commit status that codex-review.yml must be the only writer of.
# This job builds and tests; it has never needed to write anything.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev libncurses-dev

      - name: Build
        run: make build

      - name: Test
        run: make test
