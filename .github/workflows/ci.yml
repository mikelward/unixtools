name: CI

on:
  # Every branch, matching SPEC.md's contract that both builds and tests
  # run on every push — this predates the lanes retrofit and a same-repo PR
  # branch pushing before or without a PR still needs that coverage.
  # Restricting this to main (an earlier attempt) silently dropped it. The
  # actual hazard this trigger creates — a same-repo PR branch also fires
  # push, and that run always classifies as code (see the lanes job below)
  # rather than applying the pull_request run's docs-only gating, so an
  # unconditionally green push result could report over a legitimately red
  # PR-run verdict on the same commit — is handled by giving the push run's
  # check a different name below, not by narrowing what push covers.
  #
  # The gate does not run on these branch pushes at all; only build does.
  # See the lanes job's own `if:` for why.
  push:
    branches: ["**"]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the lane on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  # No workflow_dispatch: a dispatched run's workflow definition comes from
  # whichever ref was dispatched against, so dispatching against a PR branch
  # would run THAT branch's own copy of this file — a PR could rewrite the
  # lanes job to always succeed and mint its own required check, bypassing
  # everything mikelward/lanes's verifyDispatchBinding is meant to guard,
  # since that guard lives inside the file the PR branch controls. There is
  # no way to make a dispatch validate a PR's head from a trusted copy of
  # the workflow, because GitHub ties both "which file runs" and "which SHA
  # the check-run reports on" to the same dispatch ref. See mikelward/lanes
  # TODO.md for the tracked follow-up (posting a status explicitly via the
  # API from a trusted ref, instead of relying on the per-job check-run).

# The `codex` status has exactly one writer, the codex-review sweep. Declaring
# read-only here is what proves this workflow is not a second one.
permissions:
  contents: read
  # The docs lane's classify and lanes steps read the PR's files and commits
  # through the workflow token; read-only, and still nothing here can write.
  pull-requests: read

jobs:
  # Decides whether the build job may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes are always classified
  # as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # persist-credentials off like the other jobs: this is the one job
      # that runs PR-controlled code (the PR's own Makefile and tests), so
      # the token must not sit in .git/config while it does.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev libncurses-dev

      - name: Build
        run: make build

      - name: Test
        run: make test

  # The one check the ruleset should require. Always runs, always reports —
  # green only when the build job succeeded (across every matrix entry —
  # `fail-fast: false` means one failing os fails the aggregate result
  # without canceling the others), or when it was skipped and the skip is
  # INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  lanes:
    # A push run's check name is deliberately NOT "lanes": push always
    # classifies as code and skips none of the pull_request run's gating
    # (docs_only, required prefixes), so its green result must not be able
    # to satisfy a PR's required `lanes` context — see the push trigger's
    # comment above. Only a pull_request-triggered run reports as "lanes";
    # that is the one the ruleset should require.
    name: ${{ github.event_name == 'pull_request' && 'lanes' || 'lanes (push)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build]
    # On push, the default branch only — everywhere else in this fleet the
    # push trigger IS main-only, and this repo's `branches: ["**"]` is what
    # made the difference visible: the gate settles a push by proving its
    # commit heads no open pull request (mikelward/lanes `settlePush`), and
    # refuses when it does. That refusal is correct — a push's range is not
    # a pull request's diff, so a green push verdict on a PR's head would
    # satisfy that PR's required check without its diff ever being
    # classified — but on a PR branch it fires on EVERY push, by design, so
    # `lanes (push)` was permanently red on every open pull request here.
    # The commit is handed back to the pull_request run's `lanes`, which is
    # the check responsible for it and the one the ruleset requires.
    #
    # `build` is deliberately NOT narrowed with it: SPEC.md's every-push
    # contract is about the build, and it still runs on every branch.
    if: >-
      always() && (github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded before
          # the heavy job ran; a pull_request run takes the same commit from
          # its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            build=${{ needs.build.result }}
